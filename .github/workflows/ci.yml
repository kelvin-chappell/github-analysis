name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1.5.9
      - name: Build and test
        run: sbt test
